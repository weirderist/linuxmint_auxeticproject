<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell viewer</title>
<link rel="stylesheet" href="/theme.css">
</head><body>
<header class="topbar"><h1>Shell viewer <span id="rname" class="mut"></span></h1><a href="/">Home</a><a id="back" href="/shell">Shell runs</a></header>
<main>
<div id="err" class="bold"></div>
<section class="card">
 <div class="btnrow">
  <label>left <select id="fA"></select></label>
  <label>right <select id="fB"></select></label>
  <label>right run <select id="rB"></select></label>
  <label title="colour range = +- this percentile of |value| (display choice)">range pct <input id="clip" class="narrow" type="number" min="50" max="100" step="1" value="98"></label>
  <label class="chk"><input type="checkbox" id="sync" checked> sync cameras</label>
 </div>
</section>
<div class="grid2">
 <section><h2 id="tA"></h2><div class="view" id="vA"><div class="status" id="sA"></div><div class="lg" id="lA" hidden></div></div></section>
 <section><h2 id="tB"></h2><div class="view" id="vB"><div class="status" id="sB"></div><div class="lg" id="lB" hidden></div></div></section>
</div>
<section class="card"><div id="info" class="small"></div></section>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="/shellview.js"></script>
</body></html>
