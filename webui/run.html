<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run graphs</title>
<link rel="stylesheet" href="/theme.css"></head><body>
<header class="topbar"><h1>Run graphs <span id="rname" class="mut"></span></h1><a href="/">Home</a><a id="lv" href="/sim">Viewer</a><a id="ls" href="/strain">Strain</a></header>
<main>
<div id="err" class="err"></div>
<section class="card"><h2 title="loop yarn length / as-built mean loop length; 40 bins">Loop length histogram</h2>
 <div class="row"><span class="seg"><button id="hA">As built</button><button id="hR" class="on">Relaxed</button></span></div>
 <div id="hist"></div></section>
<section class="card"><h2>Loop length profile</h2>
 <div class="row"><span class="seg"><button id="pW" class="on">Along a wale</button><button id="pC">Along a course</button></span>
  <label class="small"><span id="pT"></span> <select id="pSel"></select></label><span class="seg"><button id="pA">As built</button><button id="pR" class="on">Relaxed</button></span></div>
 <div id="prof"></div></section>
<section class="card"><h2>Fold profile</h2><div id="foldTxt" class="small"></div><div id="fold"></div></section>
<p class="small mut" id="notes"></p>
</main>
<script src="/run.js"></script>
</body></html>
