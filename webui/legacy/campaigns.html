<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Older yarn campaigns</title>
<link rel="stylesheet" href="/theme.css">
</head><body>
<header class="topbar"><h1>Older campaigns <span class="mut">read only</span></h1><a href="/">Home</a><a href="/sim">Simulator</a><a href="/shell">Shell runs</a></header>
<main>
<div id="tabs" class="tabs"></div>
<div id="empty" class="mut" hidden>No campaign folders found.</div>
<div id="cur" class="stack" hidden>
 <section class="card">
  <div class="card-h">
   <div class="titlerow"><h2 id="cname"></h2><span id="pill" class="pill idle">idle</span><span id="pdetail" class="mut small"></span></div>
   <div class="btnrow"><button id="bStart" class="primary" title="campaign.py run --detach; finished runs are never repeated; a cut run resumes from its checkpoint">Start / Resume</button><button id="bStop" title="stop after the run in progress (STOP file)">Pause</button></div>
  </div>
  <div id="msg"></div>
  <div class="bar" id="bar" title=""></div>
  <div class="counts" id="barTxt"></div>
  <div class="small mut" id="eta"></div>
 </section>
 <section class="card"><div class="card-h"><span class="card-t">Summary</span></div><ul class="sum" id="sum"></ul></section>
 <section class="card">
  <div class="card-h"><span class="card-t">Runs</span></div>
  <div class="tw" title="Flags: failed the run ended in failure; not settled the iteration limit was reached before the energy stopped changing; interpenetration the closest yarn approach is below 0.97 of the contact distance; no fold no fold above the threshold."><table id="tbl"></table></div>
  <p class="note" id="tnote"></p>
  <div id="detail"></div>
 </section>
 <section>
  <div class="leg" id="cleg"></div>
  <div class="charts" id="charts">
   <div id="scat" class="contents"></div>
   <div class="card chart" id="ordercard"><div class="card-h"><span class="card-t">Metric against run order</span><select id="ymet" aria-label="metric"></select></div><div id="order"></div></div>
  </div>
 </section>
 <section><details class="box"><summary>What the columns mean</summary><div id="help" class="small"></div></details></section>
</div>
<section class="card"><div class="card-h"><span class="card-t">Datasets</span></div><div class="tw"><table id="dst" class="cols ds"></table></div></section>
</main>
<script src="/chartkit.js"></script>
<script src="/legacy/campaigns.js"></script>
</body></html>
