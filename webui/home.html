<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auxetic home</title>
<link rel="stylesheet" href="/theme.css">
</head><body>
<header class="topbar"><h1>Auxetic</h1><span id="msg" class="small mut"></span></header>
<main>
<div id="grid" class="cgrid">
 <a class="card tile" href="/sim"><div class="card-h"><span class="card-t">Simulator</span><span class="open">Open</span></div><div class="small mut">yarn relaxation, 3D viewer, strain</div></a>
 <div id="camps" class="contents"></div>
 <a class="card tile" href="/legacy/campaigns"><div class="card-h"><span class="card-t">Older campaigns</span><span class="open">Open</span></div><div class="small mut">fidelity, screen1 (read only)</div></a>
</div>
</main>
<script>
// Home (2026-11-28, K): one box per page. Shell campaign boxes: runs done, a bar coloured by the worker that finished them, and which workers are on now.
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function get(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + ": HTTP " + r.status); return r.json(); }
function card(c, w) {
  const n = c.counts || {}, total = Object.values(n).reduce((a, b) => a + (b || 0), 0) || 1, fail = (n.failed || 0) + (n.timeout || 0);
  const by = { server: (w && w.server.done) || 0, kaggle: (w && w.kaggle.done) || 0, workstation: (w && w.workstation.done) || 0 };
  const seg = (k, v) => v ? '<span class="b-' + k + '" style="width:' + (100 * v / total).toFixed(2) + '%" title="' + k + " " + v + '"></span>' : "";
  const on = w ? [w.server.runner_alive ? "server" : "", w.kaggle.enabled ? "Kaggle " + Object.values(w.kaggle.slots || {}).filter(s => s.status === "running").length : "", w.workstation.enabled ? "workstation" : ""].filter(Boolean) : [];
  return '<a class="card tile" href="/shell?c=' + encodeURIComponent(c.name) + '"><div class="card-h"><span class="card-t">' + esc(c.name) + '</span><span class="open">Open</span></div>' +
    '<div class="bignum">' + (n.done || 0) + ' <span class="small mut">/ ' + total + '</span></div>' +
    '<div class="wbar">' + seg("server", by.server) + seg("kaggle", by.kaggle) + seg("workstation", by.workstation) + seg("failed", fail) + "</div>" +
    '<div class="wleg"><span><i class="b-server"></i>' + by.server + '</span><span><i class="b-kaggle"></i>' + by.kaggle + '</span><span><i class="b-workstation"></i>' + by.workstation +
    '</span>' + (fail ? '<span><i class="b-failed"></i>' + fail + '</span>' : '') + '<span>queued ' + (n.queued || 0) + '</span></div>' +
    '<div class="small mut mt-s">' + esc(c.control) + (on.length ? " · " + esc(on.join(", ")) : "") + "</div></a>";
}
async function load() {
  try {
    const j = await get("/api/shell"), ws = await Promise.all(j.campaigns.map(c => get("/api/shell/" + encodeURIComponent(c.name) + "/workers").catch(() => null)));
    $("#camps").innerHTML = j.campaigns.map((c, i) => card(c, ws[i])).join(""); $("#msg").textContent = "";          // no clock (K 2026-11-28); errors only
  } catch (e) { $("#msg").textContent = e.message; }
}
load(); setInterval(load, 30000);
</script>
</body></html>
