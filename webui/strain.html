<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run strain</title>
<link rel="stylesheet" href="/theme.css"></head><body>
<header class="topbar"><h1>Run strain <span id="rname" class="mut"></span></h1><a href="/">Home</a><a id="lv" href="/sim">Viewer</a><a id="lg" href="/run">Run graphs</a></header>
<main>
<div id="err" class="err"></div>
<section class="card"><h2>Loop length</h2>
 <div class="row"><span class="seg"><button id="aBase">As built</button><button id="aRel" class="on">Relaxed</button></span></div>
 <div class="view" id="vA"><div class="status" id="sA"></div><div class="legend" id="lA" hidden></div></div></section>
<label class="chk"><input type="checkbox" id="sync" checked> sync cameras</label>
<section class="card"><h2 title="segment length / rest length - 1; rest length reconstructed from the as-built length, length ratio and tension">Axial strain (relaxed)</h2>
 <div class="row"><span class="seg"><button id="b3d" class="on">3D</button><button id="b2d">Flat map</button></span>
  <button id="flip" title="swap the colours of tension and compression">Flip colours</button>
  <label title="colour range = +- this percentile of |strain| (display choice)">range pct <input id="clip" class="narrow" type="number" min="50" max="100" step="1" value="98"></label></div>
 <div class="view" id="vB"><div class="status" id="sB"></div><div class="legend" id="lB" hidden></div></div>
 <div id="map" class="card"></div></section>
<section class="card"><h2>Strain graph</h2>
 <div class="row"><span class="seg"><button id="gH" class="on">Histogram</button><button id="gW">Along a wale</button><button id="gC">Along a course</button></span>
  <label id="gSelL" class="small" hidden><span id="gSelT"></span> <select id="gSel"></select></label></div>
 <div id="gr"></div><div class="small mut" id="notes"></div></section>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="/strain.js"></script>
</body></html>
