<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pure shell runs</title>
<link rel="stylesheet" href="/theme.css">
</head><body>
<header class="topbar"><h1>Shell runs</h1><a href="/">Home</a><a href="/sim">Simulator</a></header>
<main>
<div id="tabs" class="tabs"></div>
<div id="empty" class="mut small" hidden>No shell campaigns.</div>
<div id="cur" class="stack" hidden>
 <section class="card">
  <div class="card-h">
   <div class="titlerow"><h2 id="cname"></h2><span id="pill" class="pill idle">idle</span><span id="pdetail" class="mut small"></span></div>
   <div class="btnrow"><button id="bStart" class="primary" title="starts the runner in the background from the frozen code; if one is alive it only sets run">Start</button><button id="bPause" title="the run in progress finishes, then the runner waits">Pause</button><button id="bCont" title="take the next queued run again">Continue</button><button id="bStop" title="the run in progress finishes, then the runner exits">Stop after current run</button></div>
  </div>
  <div id="msg"></div>
  <div class="workers" id="workers" aria-label="workers"></div>
  <div class="stat" id="stat"></div>
  <div class="small mut" id="code"></div>
 </section>
 <section class="card">
  <div class="card-h"><span class="card-t">Runs</span></div>
  <div class="btnrow">
   <label>show <select id="fStatus"><option value="">all</option><option>done</option><option>queued</option><option>failed</option><option>timeout</option><option>rejected</option></select></label>
   <label>source <select id="fSource"><option value="">all</option><option>seed</option><option>control</option><option>variant</option><option>filler</option><option>proposer</option></select></label>
   <button id="bCompare" disabled>Compare selected</button><button id="bView" disabled>Open 3D</button><button id="bDel" disabled title="removes only shell.npz and shell.bin (3D data) of finished runs; settings, descriptors and log stay; typed confirmation">Delete 3D data</button>
  </div>
  <div class="tw"><table id="tbl"></table></div>
  <p class="note" id="tnote" hidden></p>
  <div id="detail"></div>
 </section>
 <section class="charts">
  <div class="card chart">
   <div class="card-h"><span class="card-t">Comparison graph</span><div class="btnrow"><label>x <select id="gx"></select></label><label>y <select id="gy"></select></label><label>colour <select id="gc"><option value="src">source</option><option value="seed">seed pattern</option><option value="tiles">tiles</option></select></label></div></div>
   <div class="leg" id="gleg"></div>
   <div id="gr"></div>
  </div>
 </section>
 <section class="card" id="cmpsec" hidden><div class="card-h"><span class="card-t">Selected runs</span></div><div class="tw"><table id="cmp"></table></div></section>
 <section class="card"><div class="card-h"><span class="card-t">Rules</span></div><div class="small rules" id="rules">loading</div></section>
 <section class="card" id="ansec"><div class="card-h"><span class="card-t">Analysis</span><label>results of <select id="anpick" aria-label="run count"></select></label></div>
  <div id="anstat" class="small"></div>
  <h3>Proposer vs random</h3><div id="anpe" class="small"></div>
  <div class="charts" id="ancharts"></div><div class="leg" id="anleg"></div>
  <h3>Rule search</h3><div id="ansr" class="small rules"></div>
  <details class="box mt"><summary>Definitions</summary><dl class="an-defs" id="andefs"></dl></details>
 </section>
</div>
</main>
<script src="/chartkit.js"></script>
<script src="/shell.js"></script>
</body></html>
